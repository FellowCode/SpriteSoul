[project]
name = "sprite-soul"
version = "0.1.0"
description = "Local depth and normal map editor for PNG sprites"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
  "Pillow>=10,<12",
  "PySide6>=6.7,<7",
  "transformers>=4.48,<5",
  "torch>=2.4,<3",
  "geffnet>=1.0.2,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.package-data]
"smg.ui" = ["icons/*.svg", "icons/LICENSE"]
